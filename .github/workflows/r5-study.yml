name: Build and publish Damonic R5 Study

on:
  push:
    branches: [r5-coherent-flow]
    paths:
      - studies/r5/**
      - .github/workflows/r5-study.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: damonic-r5-study-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: studies/r5/requirements.txt
      - name: Install pinned build tools
        run: python -m pip install -r studies/r5/requirements.txt
      - name: Run 16 package regression tests
        run: python -m unittest discover -s studies/r5 -p 'test_package.py' -v
      - name: Build exact R5 outlines and package
        run: |
          python studies/r5/build.py --out .build/Damonic-R5-0.5.0-alpha.5 --package
          cp .build/Damonic-R5-0.5.0-alpha.5/Damonic-R5-0.5.0-alpha.5-Source.zip .build/
          cd .build
          sha256sum Damonic-R5-0.5.0-alpha.5.zip Damonic-R5-0.5.0-alpha.5-Source.zip > RELEASE-SHA256SUMS.txt
      - name: Preserve packages and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Damonic-R5-Study-0.5.0-alpha.5
          if-no-files-found: error
          path: |
            .build/*.zip
            .build/RELEASE-SHA256SUMS.txt
            .build/Damonic-R5-0.5.0-alpha.5/BUILD-REPORT.json
            .build/Damonic-R5-0.5.0-alpha.5/QA-REPORT.json
            .build/Damonic-R5-0.5.0-alpha.5/Specimen.svg
      - name: Publish isolated experimental prerelease
        if: github.repository == 'daeon/Damonic' && github.ref == 'refs/heads/r5-coherent-flow'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > .build/RELEASE-NOTES.md <<'NOTES'
          # Damonic R5 Study — Coherent Flow

          Installable experimental **Regular** family named **Damonic R5 Study**.
          This preserves the R5 outlines exactly and does not replace Damonic 0.4.2 or its Nerd edition.

          **42 mapped characters only:** space, !, |, digits 0–9, uppercase D/I/O, and all lowercase Latin letters.
          It is not complete ASCII or a daily-use coding family. Unsupported text may trigger fallback.
          No Bold, Italic, ligatures, Nerd/Powerline symbols, variable axes or hinting are included.

          The main ZIP contains a TTF, WOFF2, editable source, an outlined specimen, OFL 1.1, checksums and build/QA reports.
          The separate Source ZIP contains ordinary editable JSON and the reproducible build tools.

          Engineering checks: 16 tests, 246 FreeType glyph/size raster checks, 600-unit advances, exact source checksum,
          repeatable TTF output, and WOFF2 geometry/metrics round-trip. These do not establish native editor compatibility,
          readability, aesthetic approval or completed family coverage.
          NOTES
          tag=r5-study-0.5.0-alpha.5
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The isolated study release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            .build/Damonic-R5-0.5.0-alpha.5.zip \
            .build/Damonic-R5-0.5.0-alpha.5-Source.zip \
            .build/RELEASE-SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Damonic R5 Study — Coherent Flow' \
            --prerelease --latest=false --notes-file .build/RELEASE-NOTES.md
